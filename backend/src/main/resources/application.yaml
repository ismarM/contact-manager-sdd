spring:
  application:
    name: contact-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contacts}
    username: ${DB_USER:contacts}
    password: ${DB_PASSWORD:contacts}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    fail-on-missing-locations: true

server:
  port: 8080

# Firebase (001, research R-01): projekt in način emulatorja (ko je FIREBASE_AUTH_EMULATOR_HOST nastavljen).
firebase:
  project-id: ${FIREBASE_PROJECT_ID:demo-contact-manager}
  auth-emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}

# Brisanje identitete pri ponudniku prijave in nadgrobniki (012, research R-07, R-16). Brez skrivnosti: poverilnice samo iz okolja.
identity-deletion:
  scheduler-enabled: true
  interval: 30s
  lease: 30s
  request-timeout: 5s
  connect-timeout: 2s
  tombstone-retention: 2h

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
  info:
    env:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] %logger{36} : %m%n"
