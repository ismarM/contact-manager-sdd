spring:
  application:
    name: contact-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contacts?reWriteBatchedInserts=true}
    username: ${DB_USER:contacts}
    password: ${DB_PASSWORD:contacts}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    fail-on-missing-locations: true
  # 014 uvoz (FR-014-08): datoteka do 10 MB; večja zahteva → 400 VALIDATION_FAILED (file: FILE_TOO_LARGE).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      # Razčlenitev ob prvem dostopu do datoteke: 401 → 404 → 403 → 409 pred napako velikosti (feature-map §2.2).
      resolve-lazily: true

server:
  port: 8080

# Firebase (001, research R-01): projekt in način emulatorja (ko je FIREBASE_AUTH_EMULATOR_HOST nastavljen).
firebase:
  project-id: ${FIREBASE_PROJECT_ID:demo-contact-manager}
  auth-emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}

# Brisanje identitete pri ponudniku prijave in nadgrobniki (012, research R-07, R-16). Brez skrivnosti: poverilnice samo iz okolja.
identity-deletion:
  scheduler-enabled: true
  interval: 30s
  lease: 30s
  request-timeout: 5s
  connect-timeout: 2s
  tombstone-retention: 2h

# 019 API ključi (docs/specs/019-api-kljuci/research.md R-01, R-05 … R-07): ključ je cmk_ + JWT HS256, podpisan s skrivnostjo
# iz okolja (base64, vsaj 32 bajtov). Brez privzete vrednosti: brez API_KEY_SIGNING_SECRET se zaledje ne zažene.
api-keys:
  signing-secret: ${API_KEY_SIGNING_SECRET:}
  rate-limit: 120
  stats-zone: Europe/Ljubljana
  purge-interval: 1h

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
  info:
    env:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] %logger{36} : %m%n"

# Slike (018, plan.md – Technical Context): meje obdelave in omejitev nalaganj.
images:
  max-bytes: 5242880
  max-side: 4096
  decode-side: 2048
  concurrent: 2
  upload-per-minute: 10
  google:
    allowed-hosts:
      - '^lh[0-9]+\.googleusercontent\.com$'

# 016 kartografski posrednik (docs/specs/016-tipizirani-atributi/research.md R-08): OpenStreetMap samo prek strežnika;
# URL-ji so nastavljivi (v testih nadomestni strežnik). User-Agent brez osebnih podatkov. Vsi predpomnilniki so v pomnilniku.
maps:
  enabled: ${MAPS_ENABLED:true}
  nominatim-url: ${MAPS_NOMINATIM_URL:https://nominatim.openstreetmap.org}
  photon-url: ${MAPS_PHOTON_URL:https://photon.komoot.io}
  tile-url: ${MAPS_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
  user-agent: ${MAPS_USER_AGENT:ContactManager/1.0 (+https://github.com/ismarM/contact-manager-sdd)}
  connect-timeout: 2s
  read-timeout: 2500ms
  locations:
    entries: 1000
    ttl: 24h
  suggestions:
    entries: 2000
    ttl: 1h
  tiles:
    max-cache-bytes: 52428800
    max-age: 7d
  limits:
    nominatim-per-second: 1
    max-wait: 1s
    photon-per-second: 5
    photon-per-user-per-second: 2
    tiles-per-user-per-window: 60
    tiles-window: 10s
    tiles-per-second: 20
