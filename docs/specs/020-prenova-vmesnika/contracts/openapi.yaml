# 020 Prenova vmesnika – pogodba. Spremenjen je samo GET /api/groups (nadomešča GroupSections iz docs/specs/002-skupine).
openapi: 3.1.0
info: { title: Contact Manager – seznam skupin (020), version: "2" }
paths:
  /api/groups:
    get:
      operationId: listGroups
      summary: Moje nearhivirane skupine kot en paginiran seznam z vlogo na elementu (FR-020-10, FR-020-11)
      description: >
        Samo skupine, katerih član je klicatelj. Urejeno po naslovu (kolacija `lang`), nato id. Uporabnik brez profila
        dobi prazen seznam. Neveljaven parameter → 400 VALIDATION_FAILED. Brez žetona → 401.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, required: false, schema: { $ref: "#/components/schemas/Role" } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [sl, en], default: en } }
      responses:
        "200":
          description: Stran skupin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupPage" }
        "400": { description: ValidationFailed (docs/specs/002) }
        "401": { description: Unauthenticated (docs/specs/002) }
components:
  schemas:
    Role: { type: string, enum: [OWNER, ADMIN, EDITOR, VIEWER] }
    GroupItem:
      type: object
      required: [id, title, description, color, contactCount, role]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        color: { type: string }
        contactCount: { type: integer }
        photoRevision: { type: [integer, "null"] }
        role: { $ref: "#/components/schemas/Role" }
    GroupPage:
      type: object
      required: [total, page, size, items]
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/GroupItem" } }
