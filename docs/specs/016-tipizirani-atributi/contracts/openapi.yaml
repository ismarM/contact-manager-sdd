openapi: 3.0.3
info: {title: 016 tipizirani atributi (nove poti in spremenjene sheme), version: 1.0.0}
paths:
  /api/groups/{groupId}/attribute-keys:
    get:
      summary: Ključi skupine v uporabi s tipom in številom kontaktov (VIEWER, arhivirana dovoljena). Natančno ujemanje s q (brez razlike velikosti črk) je prvo, nato po ključu.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 50}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, enum: [25, 50, 100], default: 25}}
      responses:
        '200': {content: {application/json: {schema: {$ref: '#/components/schemas/AttributeKeyPage'}}}}
        '400': {description: "VALIDATION_FAILED (q TOO_LONG, page/size INVALID_VALUE)"}
        '401': {description: UNAUTHENTICATED}
        '404': {description: skupina ne obstaja ali ni član}
  /api/groups/{groupId}/attribute-keys/change-type:
    post:
      summary: Atomarna sprememba tipa ključa z normalizacijo vseh vrednosti, en vnos sledi ATTRIBUTE_TYPE (EDITOR, arhivirana 409).
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [key, type, version]
              properties:
                key: {type: string, description: "ključ v poljubni velikosti črk"}
                type: {$ref: '#/components/schemas/AttributeType'}
                version: {type: integer, format: int64}
      responses:
        '200': {content: {application/json: {schema: {$ref: '#/components/schemas/AttributeKey'}}}}
        '400': {description: "VALIDATION_FAILED (key REQUIRED, type INVALID_VALUE, version REQUIRED)"}
        '401': {description: UNAUTHENTICATED}
        '403': {description: FORBIDDEN (VIEWER)}
        '404': {description: ni član ali ključ ni v uporabi}
        '409':
          description: "GROUP_ARCHIVED | VERSION_CONFLICT (current: AttributeKey, kot pri drugih virih) | ATTRIBUTE_TYPE_CONFLICT (details: TypeConflict). Enak tip kot trenutni → 200 brez spremembe in brez vnosa."
          content: {application/json: {schema: {$ref: '#/components/schemas/TypeConflictError'}}}
  /api/groups/{groupId}/contacts/{contactId}/address-location:
    get:
      summary: Lokacija naslova kontakta prek posrednika OSM (VIEWER, arhivirana dovoljena). Brez key = predefiniran naslov. Koordinate se ne shranijo.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contactId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: key, in: query, required: false, schema: {type: string}, description: "ključ atributa tipa ADDRESS"}
        - {name: language, in: query, required: false, schema: {type: string, enum: [sl, en]}}
      responses:
        '200': {content: {application/json: {schema: {$ref: '#/components/schemas/AddressLocation'}}}}
        '401': {description: UNAUTHENTICATED – nič ni posredovano}
        '404': {description: "skupina/kontakt ni viden, kontakt druge skupine, ni naslova ali atribut ni tipa ADDRESS – nič ni posredovano"}
        '503': {description: MAP_SERVICE_UNAVAILABLE (storitev nedosegljiva, počasna, omejitev pogostosti)}
  /api/groups/{groupId}/address-suggestions:
    get:
      summary: Do 5 predlogov naslova (EDITOR, arhivirana dovoljena kot 013 predlogi). Napaka storitve ali omejitev → 200 s praznim seznamom.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: q, in: query, required: true, schema: {type: string, minLength: 3, maxLength: 300}}
        - {name: country, in: query, required: false, schema: {type: string, pattern: '^[A-Z]{2}$'}, description: prednostna država}
        - {name: language, in: query, required: false, schema: {type: string, enum: [sl, en]}}
      responses:
        '200': {content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/AddressSuggestion'}}}}}}}
        '400': {description: "VALIDATION_FAILED (q REQUIRED | TOO_SHORT | TOO_LONG, country INVALID_VALUE)"}
        '401': {description: UNAUTHENTICATED}
        '403': {description: FORBIDDEN (VIEWER)}
        '404': {description: ni član}
  /api/map-tiles/{z}/{x}/{y}.png:
    get:
      summary: Ploščica podlage OSM prek posrednika (prijavljen uporabnik, ni vezano na skupino). Cache-Control private.
      parameters:
        - {name: z, in: path, required: true, schema: {type: integer, minimum: 0, maximum: 19}}
        - {name: x, in: path, required: true, schema: {type: integer, minimum: 0, description: "< 2^z"}}
        - {name: y, in: path, required: true, schema: {type: integer, minimum: 0, description: "< 2^z"}}
      responses:
        '200': {content: {image/png: {schema: {type: string, format: binary}}}}
        '400': {description: VALIDATION_FAILED (koordinate izven obsega)}
        '401': {description: UNAUTHENTICATED}
        '503': {description: MAP_SERVICE_UNAVAILABLE}
  /api/me/preferences:
    put:
      summary: "001 + neobvezna polja oblike zapisa; manjka = nespremenjeno, null = privzeto (enako PUT /api/me)"
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/Preferences'}}}
      responses:
        '200': {content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '400': {description: "VALIDATION_FAILED (phoneFormat|dateFormat|addressFormat INVALID_VALUE)"}
        '401': {description: UNAUTHENTICATED}
components:
  schemas:
    AttributeType: {type: string, enum: [OTHER, NOTES, EMAIL, PHONE, ADDRESS, URL, DATE]}
    Address:
      type: object
      description: "vsaj street ali city; prazni deli izpuščeni"
      properties:
        street: {type: string, maxLength: 200}
        extra: {type: string, maxLength: 200}
        postalCode: {type: string, maxLength: 20}
        city: {type: string, maxLength: 100}
        region: {type: string, maxLength: 100}
        country: {type: string, pattern: '^[A-Z]{2}$'}
    Attribute:
      type: object
      required: [key]
      description: "Zahtevek: type neobvezen (obstoječ ključ → njegov tip, nov → OTHER); drugačen od tipa ključa v uporabi → 400 INVALID_VALUE na attributes[i].type. Natanko eno od value/parts; parts samo pri ADDRESS. Odgovor: type vedno."
      properties:
        key: {type: string, minLength: 1, maxLength: 50}
        type: {$ref: '#/components/schemas/AttributeType'}
        value: {type: string, nullable: true, description: "kanonična oblika; ADDRESS: nerazčlenjen naslov"}
        parts: {allOf: [{$ref: '#/components/schemas/Address'}], nullable: true}
    ContactFieldsChange:
      type: object
      description: "Sprememba ContactInput/ContactDetail/ContactState/CompareContact/VcardContact/ImportContact: address (besedilo, nerazčlenjen) in nova addressParts – največ eno ni null; attributes: Attribute zgoraj; email, phone kanonično."
      properties:
        address: {type: string, nullable: true, maxLength: 300}
        addressParts: {allOf: [{$ref: '#/components/schemas/Address'}], nullable: true}
        attributes: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/Attribute'}}
    BulkSetAttribute:
      type: object
      description: "009 nastavi atribut: + type (nov ključ) in parts; normalizacija po državi vsakega kontakta, ena neveljavna → 400, nič se ne spremeni"
      properties:
        key: {type: string}
        type: {$ref: '#/components/schemas/AttributeType'}
        value: {type: string, nullable: true}
        parts: {allOf: [{$ref: '#/components/schemas/Address'}], nullable: true}
    AttributeKey:
      type: object
      required: [key, type, contactCount, version]
      properties:
        key: {type: string, description: kanonični zapis 013}
        type: {$ref: '#/components/schemas/AttributeType'}
        contactCount: {type: integer}
        version: {type: integer, format: int64}
    AttributeKeyPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AttributeKey'}}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer}
    TypeConflictError:
      type: object
      required: [code]
      properties:
        code: {type: string, enum: [ATTRIBUTE_TYPE_CONFLICT, VERSION_CONFLICT, GROUP_ARCHIVED]}
        current: {$ref: '#/components/schemas/AttributeKey', description: "samo pri VERSION_CONFLICT"}
        details:
          type: object
          description: "samo pri ATTRIBUTE_TYPE_CONFLICT"
          properties:
            total: {type: integer}
            contacts:
              type: array
              maxItems: 100
              items: {type: object, required: [contactId, displayName, value], properties: {contactId: {type: string, format: uuid}, displayName: {type: string}, value: {type: string}}}
    AddressLocation:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [EXACT, APPROXIMATE, NOT_FOUND]}
        latitude: {type: number, nullable: true}
        longitude: {type: number, nullable: true}
    AddressSuggestion:
      allOf:
        - {$ref: '#/components/schemas/Address'}
        - {type: object, required: [label], properties: {label: {type: string}}}
    Preferences:
      type: object
      required: [language, theme]
      properties:
        language: {type: string, enum: [sl, en], nullable: true}
        theme: {type: string, enum: [light, dark], nullable: true}
        phoneFormat: {type: string, enum: [INTERNATIONAL, NATIONAL, E164], nullable: true}
        dateFormat: {type: string, enum: [LOCALE, ISO, LONG], nullable: true}
        addressFormat: {type: string, enum: [COUNTRY, SINGLE_LINE], nullable: true}
    Profile:
      type: object
      description: "001 Profile + phoneFormat, dateFormat, addressFormat (null = privzeto)"
    AuditEntryChange:
      type: object
      description: "AuditEntry (005): action + ATTRIBUTE_TYPE; nova polja attributeKey, typeBefore, typeAfter (samo pri ATTRIBUTE_TYPE). Filter ?action=ATTRIBUTE_TYPE."
    SuggestionChange:
      type: object
      description: "013 Suggestion pri type=key: + attributeType"
