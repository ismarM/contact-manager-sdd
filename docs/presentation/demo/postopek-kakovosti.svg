ijski in varnostni</text><text x="598" y="317" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">testi (Testcontainers)</text><path d="M828 300H854" fill="none" stroke="#1F4F99" stroke-width="2"  marker-end="url(#a)"/><rect x="856" y="250" width="244" height="100" rx="10" fill="#FFFFFF" stroke="#8B857C"/><text x="870" y="276" font-size="16" font-weight="700" fill="#1B1A17" text-anchor="start">./verify.sh e2e</text><text x="870" y="298" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">celoten sistem v Compose,</text><text x="870" y="317" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">Playwright + axe</text><path d="M1100 300H1126" fill="none" stroke="#1F4F99" stroke-width="2"  marker-end="url(#a)"/><rect x="1128" y="250" width="244" height="100" rx="10" fill="#FFFFFF" stroke="#8B857C"/><text x="1142" y="276" font-size="16" font-weight="700" fill="#1B1A17" text-anchor="start">Pull request → main</text><text x="1142" y="298" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">GitHub Actions požene</text><text x="1142" y="317" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">quick, backend, e2e</text></svg>