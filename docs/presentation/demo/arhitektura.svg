" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#8B857C"/><text x="832" y="656" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="start">maps</text><text x="832" y="677" font-size="12" font-weight="400" fill="#625D55" text-anchor="start">naslovi, zemljevid</text><text x="84" y="724" font-size="12" font-weight="400" fill="#625D55" text-anchor="start">shared – avtorizacija po skupinah, napake, varnost</text><rect x="70" y="776" width="940" height="74" rx="10" fill="#FFFFFF" stroke="#8B857C"/><text x="84" y="802" font-size="16" font-weight="700" fill="#1B1A17" text-anchor="start">PostgreSQL 18</text><text x="84" y="824" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">15 migracij Flyway  ·  kontakti, skupine, revizijska sled, slike (bytea), zgoščene vrednosti gesel za aplikacije</text><rect x="1110" y="110" width="290" height="134" rx="10" fill="#FBF1DB" stroke="#8B857C"/><text x="1124" y="136" font-size="16" font-weight="700" fill="#1B1A17" text-anchor="start">Firebase Authentication</text><text x="1124" y="158" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">Google ali e-pošta in geslo</text><text x="1124" y="177" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">gesla hrani samo Firebase</text><text x="1124" y="196" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">v razvoju in testih: Auth Emulator</text><rect x="1110" y="556" width="290" height="134" rx="10" fill="#FBF1DB" stroke="#8B857C"/><text x="1124" y="582" font-size="16" font-weight="700" fill="#1B1A17" text-anchor="start">OpenStreetMap</text><text x="1124" y="604" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">Nominatim, Photon, ploščice</text><text x="1124" y="623" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">kliče jih samo zaledje</text><text x="1124" y="642" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">z omejevanjem in predpomnilnikom</text><pat