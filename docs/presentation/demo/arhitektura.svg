<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890" font-family="Atkinson Hyperlegible Next, Inter, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F4F99"/></marker></defs><rect width="1440" height="890" fill="#F7F6F2"/><text x="40" y="46" font-size="28" font-weight="700" fill="#1B1A17" text-anchor="start">Contact Manager – arhitektura rešitve</text><text x="40" y="72" font-size="14" font-weight="400" fill="#625D55" text-anchor="start">Produkcijska postavitev (Docker Compose, compose.yaml + compose.firebase.yaml)</text><rect x="40" y="110" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#8B857C"/><text x="54" y="136" font-size="16" font-weight="700" fill="#1B1A17" text-anchor="start">Brskalnik (PWA)</text><text x="54" y="158" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">React 19, TypeScript, Vite, Tailwind</text><text x="54" y="177" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">slovenščina / angleščina, 360–1280 px</text><rect x="390" y="110" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#8B857C"/><text x="404" y="136" font-size="16" font-weight="700" fill="#1B1A17" text-anchor="start">Odjemalci CardDAV</text><text x="404" y="158" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">iOS, DAVx5, Thunderbird</text><text x="404" y="177" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">samo branje, geslo za aplikacijo</text><rect x="740" y="110" width="300" height="96" rx="10" fill="#FFFFFF" stroke="#8B857C"/><text x="754" y="136" font-size="16" font-weight="700" fill="#1B1A17" text-anchor="start">Skripte in programi</text><text x="754" y="158" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">REST API /v1</text><text x="754" y="177" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">API ključ (podpisan JWT)</text><rect x="40" y="270" width="1000" height="600" rx="14" fill="none" stroke="#8B857C" stroke-dasharray="8 6"/><text x="320" y="294" font-size="13" font-weight="600" fill="#625D55" text-anchor="start">Strežnik – Docker Compose</text><rect x="70" y="310" width="940" height="52" rx="10" fill="#FFFFFF" stroke="#8B857C"/><text x="84" y="336" font-size="16" font-weight="700" fill="#1B1A17" text-anchor="start">Caddy – HTTPS, samodejna potrdila (80 / 443)</text><rect x="70" y="400" width="940" height="74" rx="10" fill="#FFFFFF" stroke="#8B857C"/><text x="84" y="426" font-size="16" font-weight="700" fill="#1B1A17" text-anchor="start">nginx (frontend)</text><text x="84" y="448" font-size="13" font-weight="400" fill="#625D55" text-anchor="start">statični vmesnik (PWA)  ·  posrednik za /api, /v1, /dav  ·  omejitve velikosti nalaganj  ·  ID zahtevka</text><rect x="70" y="512" width="940" height="226" rx="12" fill="#E8EEFA" stroke="#1F4F99"/><text x="84" y="538" font-size="17" font-weight="700" fill="#1B1A17" text-anchor="start">Zaledje – Java 21, Spring Boot 4</text><text x="996" y="538" font-size="12" font-weight="400" fill="#625D55" text-anchor="end">tri ločene varnostne verige: /api (Firebase JWT) · /v1 (API ključ) · /dav (HTTP Basic)</text><rect x="84" y="554" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#8B857C"/><text x="96" y="580" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="start">account</text><text x="96" y="601" font-size="12" font-weight="400" fill="#625D55" text-anchor="start">profil, izbris, izvoz</text><rect x="268" y="554" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#8B857C"/><text x="280" y="580" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="start">group</text><text x="280" y="601" font-size="12" font-weight="400" fill="#625D55" text-anchor="start">skupine, arhiv</text><rect x="452" y="554" width="172" height="64" rx="8" fill="#FFFFFF" stroke="#8B857C"/><text x="464" y="580" font-size="15"