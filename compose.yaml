# Celoten sistem (FR-000-01). Vrata objavita compose.override.yaml (razvoj) in compose.verify.yaml (verify full).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contacts}
      POSTGRES_USER: ${POSTGRES_USER:-contacts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contacts}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  auth:
    build: ./firebase
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9099/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-contacts}
      DB_USER: ${POSTGRES_USER:-contacts}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-contacts}
      FIREBASE_AUTH_EMULATOR_HOST: auth:9099
      FIREBASE_PROJECT_ID: demo-contact-manager
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_FIREBASE_PROJECT_ID: demo-contact-manager
        VITE_FIREBASE_EMULATOR: "true"
    depends_on:
      auth:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  db-data:
