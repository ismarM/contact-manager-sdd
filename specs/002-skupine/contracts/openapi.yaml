openapi: 3.1.0
info:
  title: Contact Manager API – skupine (002)
  version: 0.1.0
  description: >
    Skupine kontaktov: ustvarjanje, seznam po vlogah, branje in urejanje podatkov skupine. Vsi endpointi zahtevajo
    veljaven ID žeton Firebase (glej specs/001-prijava/contracts). Vrstni red preverjanj pri endpointih skupine
    (feature-map §2.2): 401, 404 (nečlan = neobstoječa skupina, prazno telo), 403, 409 GROUP_ARCHIVED, 409 VERSION_CONFLICT,
    400 VALIDATION_FAILED. Koda FORBIDDEN je v registru kod (feature-map §2.10, D-25).
servers:
  - url: http://localhost:8080
security:
  - firebaseIdToken: []
paths:
  /api/groups:
    post:
      operationId: createGroup
      summary: Ustvari skupino; ustvarjalec postane edini član z vlogo OWNER (FR-002-01, -02, -03)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroup" }
            example: { title: Projekt FERI, description: Kontakti projekta, color: mah }
      responses:
        "201":
          description: Skupina je ustvarjena; telo ima role OWNER, version 0.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    get:
      operationId: listMyGroups
      summary: Moje nearhivirane skupine po vlogah, paginirano po razdelkih (FR-002-04, -05, -06)
      description: >
        Brez `role` vrne prvo stran vsakega nepraznega razdelka (OWNER, ADMIN, EDITOR, VIEWER); z `role` in `page` samo
        izbrani razdelek. Skupine so urejene po naslovu po pravilih jezika `lang`, nato po `id`. Arhiviranih in tujih
        skupin ni.
      parameters:
        - { name: role, in: query, required: false, schema: { $ref: "#/components/schemas/Role" } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [sl, en], default: en } }
      responses:
        "200":
          description: Razdelki; razdelek brez skupin ni vključen, uporabnik brez skupin dobi `sections: []`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupSections" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/groups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getGroup
      summary: Podatki skupine za glavo in Nastavitve; dovoljeno tudi v arhivirani skupini (FR-002-07, -08, -10)
      description: Najnižja vloga VIEWER.
      responses:
        "200":
          description: Skupina z vlogo klicatelja.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateGroup
      summary: Urejanje naslova, opisa in barve z optimističnim zaklepanjem (FR-002-02, -11, -12)
      description: >
        Najnižja vloga ADMIN. VIEWER in EDITOR → 403 (tudi v arhivirani skupini); ADMIN in OWNER v arhivirani skupini →
        409 GROUP_ARCHIVED. Zastarela verzija → 409 VERSION_CONFLICT (tudi pri nespremenjenih podatkih). Nespremenjeni
        podatki z veljavno verzijo → 200, verzija, izvajalec in čas ostanejo nespremenjeni.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroup" }
            example: { title: Projekt FERI 2, description: null, color: tinta, version: 3 }
      responses:
        "200":
          description: Posodobljena (ali nespremenjena) skupina.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Skupina je arhivirana ali verzija ni več trenutna.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GroupArchived"
                  - $ref: "#/components/schemas/VersionConflict"
components:
  securitySchemes:
    firebaseIdToken: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Unauthenticated:
      description: Brez žetona, neveljaven ali potekel žeton.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: UNAUTHENTICATED }
    NotFound:
      description: Skupina ne obstaja ali klicatelj ni član (enak odgovor); prazno telo.
    Forbidden:
      description: Vloga klicatelja je pod najnižjo dovoljeno.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: FORBIDDEN }
    ValidationFailed:
      description: Neveljavni podatki; nič se ne ustvari ali spremeni.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationFailed" }
          example: { code: VALIDATION_FAILED, errors: [{ field: title, code: REQUIRED }] }
  schemas:
    Role:
      type: string
      enum: [OWNER, ADMIN, EDITOR, VIEWER]
    Color:
      type: string
      enum: [tinta, mah, opeka, oker, sliva, morje, grafit, rja]
    CreateGroup:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, description: "Po obrezu 1–100 znakov." }
        description: { type: [string, "null"], description: "Do 1000 znakov; prazen niz ali presledki = brez opisa." }
        color: { oneOf: [{ $ref: "#/components/schemas/Color" }, { type: "null" }], description: "Privzeto tinta." }
    UpdateGroup:
      type: object
      additionalProperties: false
      required: [title, description, color, version]
      properties:
        title: { type: string }
        description: { type: [string, "null"] }
        color: { $ref: "#/components/schemas/Color" }
        version: { type: integer, format: int64, description: "Verzija, ki jo je uporabnik videl." }
    UserRef:
      type: object
      required: [name, email]
      properties:
        name: { type: [string, "null"] }
        email: { type: string }
    GroupDetail:
      type: object
      required: [id, title, description, color, role, archived, version, updatedAt, updatedBy]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        color: { $ref: "#/components/schemas/Color" }
        role: { $ref: "#/components/schemas/Role" }
        archived: { type: boolean }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }]
          description: "null = izbrisan uporabnik."
    GroupSummary:
      type: object
      required: [id, title, description, color, contactCount]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        color: { $ref: "#/components/schemas/Color" }
        contactCount: { type: integer, minimum: 0, description: "Do 004 vedno 0." }
    GroupSection:
      type: object
      required: [role, total, page, size, items]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        total: { type: integer, minimum: 1 }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/GroupSummary" }
    GroupSections:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items: { $ref: "#/components/schemas/GroupSection" }
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
    GroupArchived:
      type: object
      required: [code]
      properties:
        code: { type: string, const: GROUP_ARCHIVED }
    VersionConflict:
      type: object
      required: [code, current]
      properties:
        code: { type: string, const: VERSION_CONFLICT }
        current: { $ref: "#/components/schemas/GroupDetail" }
    ValidationFailed:
      type: object
      required: [code, errors]
      properties:
        code: { type: string, const: VALIDATION_FAILED }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string, enum: [title, description, color, version, role, page, size, lang, body] }
              code: { type: string, enum: [REQUIRED, TOO_LONG, INVALID_VALUE, UNKNOWN_FIELD, MALFORMED] }
