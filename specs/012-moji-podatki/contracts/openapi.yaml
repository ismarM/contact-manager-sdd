openapi: 3.1.0
info:
  title: Contact Manager API – moji podatki (012)
  version: 0.1.0
  description: >
    Izvoz uporabnikovih podatkov (JSON), seznam skupin, ki blokirajo izbris računa, in izbris računa. Vse tri operacije so vezane na prijavljenega uporabnika (identiteta samo iz ID žetona,
    FR-001-07): poti nimajo identifikatorja uporabnika, zato tujega računa ni mogoče nasloviti (FR-012-16; poti kot `/api/users/{id}/…` ne obstajajo → 404).
    Vrstni red preverjanj izbrisa: 401, 400 VALIDATION_FAILED, 409 OWNS_ACTIVE_GROUPS. Neprijavljen, neveljaven, potekel žeton **in žeton izbrisanega uporabnika** (FR-012-15) → 401 UNAUTHENTICATED.
    Izbris računa se ne zapiše v revizijsko sled (feature-map §2.7). Operacije niso vezane na skupino: vloga `—`, arhiviranost skupine ni pogoj.
servers:
  - url: http://localhost:8080
security:
  - firebaseIdToken: []
paths:
  /api/me/export:
    get:
      operationId: exportMyData
      summary: Izvoz mojih podatkov (FR-012-01 … FR-012-04, FR-012-16)
      description: >
        Posnetek podatkov prijavljenega uporabnika (en `REPEATABLE READ` posnetek: popoln ali nič). Brez kontaktov, revizijskih sledi in osebnih podatkov drugih uporabnikov,
        z izjemama iz spec.md (ime pošiljatelja prejetega povabila, e-naslov povabljenega pri poslanem povabilu). Vsi seznami so v celoti (ni paginacije). Odgovor se ne predpomni.
        Odjemalec datoteko shrani pod imenom `moji-podatki-YYYY-MM-DD.json` z lokalnim datumom brskalnika.
      responses:
        "200":
          description: Podatki uporabnika.
          headers:
            Content-Disposition:
              description: 'attachment; filename="moji-podatki-YYYY-MM-DD.json" (datum po UTC; za odjemalce brez brskalnika).'
              schema: { type: string }
            Cache-Control:
              description: no-store
              schema: { type: string }
            X-Content-Type-Options:
              description: nosniff
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyData" }
              example:
                formatVersion: 1
                exportedAt: "2026-11-02T09:30:00Z"
                profile:
                  name: Pia Kos
                  email: pia.kos@example.org
                  registeredAt: "2026-10-01T08:00:00Z"
                  language: en
                  theme: dark
                memberships:
                  - { groupTitle: Projekt FERI, role: OWNER, joinedAt: "2026-10-01T08:05:00Z", state: ACTIVE }
                  - { groupTitle: Arhiv 2025, role: EDITOR, joinedAt: "2026-10-03T10:00:00Z", state: ARCHIVED }
                  - { groupTitle: Stara skupina, role: VIEWER, joinedAt: "2026-10-04T10:00:00Z", state: PERMANENTLY_ARCHIVED }
                receivedInvitations:
                  - { groupTitle: Klub, offeredRole: EDITOR, sender: { name: Ana Novak, deleted: false }, createdAt: "2026-11-01T12:00:00Z" }
                  - { groupTitle: Društvo, offeredRole: VIEWER, sender: { name: izbrisan uporabnik, deleted: true }, createdAt: "2026-11-01T13:00:00Z" }
                sentInvitations:
                  - { groupTitle: Projekt FERI, offeredRole: VIEWER, inviteeEmail: cene.kralj@example.org, createdAt: "2026-11-02T07:00:00Z" }
                ownedGroups:
                  - { title: Projekt FERI, description: Skupni stiki, color: tinta, state: ACTIVE, createdAt: "2026-10-01T08:05:00Z" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/me/deletion-blockers:
    get:
      operationId: listAccountDeletionBlockers
      summary: Skupine, ki preprečujejo izbris računa (FR-012-06, SC-007)
      description: >
        Nearhivirane skupine, katerih lastnik je uporabnik, po naslovu naraščajoče (kolacija jezika vmesnika ni potrebna: `title_sl`, kot v 002). Prazen seznam = izbris ni blokiran.
        Isti seznam vrne `POST /api/me/deletion` pri `409 OWNS_ACTIVE_GROUPS`.
      responses:
        "200":
          description: Seznam blokirnih skupin (lahko prazen).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionBlockers" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/me/deletion:
    post:
      operationId: deleteMyAccount
      summary: Izbris računa (FR-012-05 … FR-012-15, FR-012-17, FR-012-18)
      description: >
        Potrditev z vpisom lastnega e-naslova (po obrezu, brez velikosti črk; primerja se z e-naslovom v bazi). Ena transakcija: zaklep vseh skupin uporabnika po naraščajočem `id`, preverjanje pod zaklepom,
        izbris podatkov in uporabnika, zapis nadgrobnika; po potrditvi (commit) takojšen klic Firebase `accounts:delete` (OAuth 2.0 dostop storitvenega računa; nikoli ID žeton uporabnika).
        **Dve uspešni stanji (FR-012-17):** `204` – lokalni račun IN identiteta pri Firebase sta izbrisana (tudi če je identiteta že izbrisana); `202` – lokalni račun je izbrisan, brisanje identitete pa
        čaka (Firebase nedosegljiv ali začasna napaka) in se ponavlja v ozadju, dokler ne uspe. V obeh stanjih so lokalni podatki izbrisani in žeton neuporaben (401); v stanju 202 se uporabnik z istim
        Google računom morda še ne more znova registrirati (prijava = 401), dokler brisanje pri Firebase ne uspe. Drugi sočasni zahtevek istega uporabnika dobi 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccount" }
      responses:
        "204":
          description: Lokalni račun in identiteta pri Firebase sta izbrisana. Odjemalec uporabnika odjavi in prikaže »Tvoj račun je izbrisan.«.
        "202":
          description: >
            Lokalni račun je izbrisan in ostane izbrisan; brisanje identitete pri Firebase čaka na ponavljanje (nedosegljiv ali začasna napaka). Odjemalec uporabnika odjavi in prikaže, da je račun izbrisan,
            brisanje povezave z Google računom pa še poteka, zato ponovna registracija z istim Google računom nekaj časa morda ne bo mogoča.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityDeletionPending" }
              example: { code: IDENTITY_DELETION_PENDING }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: Uporabnik je lastnik vsaj ene nearhivirane skupine; nič se ni spremenilo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnsActiveGroups" }
              example: { code: OWNS_ACTIVE_GROUPS, groups: [{ id: "0193e5b2-7c1a-7b3e-9d2f-1a2b3c4d5e6f", title: Projekt FERI }] }
components:
  securitySchemes:
    firebaseIdToken: { type: http, scheme: bearer, bearerFormat: Firebase ID token }
  responses:
    Unauthenticated:
      description: Ni žetona, neveljaven ali potekel žeton, žeton izbrisanega uporabnika ali uporabnik ne obstaja več (drugi zahtevek izbrisa).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: UNAUTHENTICATED }
    ValidationFailed:
      description: Neveljavni podatki (nič se ne spremeni).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationFailed" }
  schemas:
    Error:
      type: object
      required: [code]
      properties: { code: { type: string } }
    ValidationFailed:
      type: object
      required: [code, errors]
      properties:
        code: { type: string, const: VALIDATION_FAILED }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string, enum: [email, body] }
              code: { type: string, enum: [REQUIRED, MISMATCH, UNKNOWN_FIELD, MALFORMED] }
    DeleteAccount:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, description: "Lasten e-naslov uporabnika; prazen ali manjkajoč → 400 REQUIRED, drug → 400 MISMATCH." }
    BlockingGroup:
      type: object
      required: [id, title]
      properties:
        id: { type: string, format: uuid, description: "Id skupine (poti /groups/:groupId); ne notranji id uporabnika." }
        title: { type: string }
    DeletionBlockers:
      type: object
      required: [groups]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/BlockingGroup" } }
    IdentityDeletionPending:
      type: object
      required: [code]
      properties:
        code: { type: string, const: IDENTITY_DELETION_PENDING }
    OwnsActiveGroups:
      type: object
      required: [code, groups]
      properties:
        code: { type: string, const: OWNS_ACTIVE_GROUPS }
        groups: { type: array, items: { $ref: "#/components/schemas/BlockingGroup" } }
    Role:
      type: string
      enum: [OWNER, ADMIN, EDITOR, VIEWER]
    OfferedRole:
      type: string
      enum: [ADMIN, EDITOR, VIEWER]
    MyData:
      type: object
      description: Neodvisen od jezika vmesnika (vloge in stanja so kode, datumi ISO 8601 z `Z`). Brez notranjih identifikatorjev.
      required: [formatVersion, exportedAt, profile, memberships, receivedInvitations, sentInvitations, ownedGroups]
      properties:
        formatVersion: { type: integer, const: 1 }
        exportedAt: { type: string, format: date-time }
        profile:
          type: object
          required: [name, email, registeredAt, language, theme]
          properties:
            name: { type: [string, "null"] }
            email: { type: string }
            registeredAt: { type: string, format: date-time }
            language: { type: [string, "null"], enum: [sl, en, null], description: "Izbira v profilu; null, če ni izbrana (FR-001-19)." }
            theme: { type: [string, "null"], enum: [light, dark, null], description: "null = Sistemska ali ni izbrana." }
        memberships:
          type: array
          items:
            type: object
            required: [groupTitle, role, joinedAt, state]
            properties:
              groupTitle: { type: string }
              role: { $ref: "#/components/schemas/Role" }
              joinedAt: { type: string, format: date-time }
              state: { type: string, enum: [ACTIVE, ARCHIVED, PERMANENTLY_ARCHIVED] }
        receivedInvitations:
          type: array
          items:
            type: object
            required: [groupTitle, offeredRole, sender, createdAt]
            properties:
              groupTitle: { type: string }
              offeredRole: { $ref: "#/components/schemas/OfferedRole" }
              sender:
                type: object
                required: [name, deleted]
                description: "Izbrisan pošiljatelj: name = »izbrisan uporabnik«, deleted = true. E-naslova pošiljatelja izvoz ne vsebuje (FR-012-03)."
                properties:
                  name: { type: [string, "null"] }
                  deleted: { type: boolean }
              createdAt: { type: string, format: date-time }
        sentInvitations:
          type: array
          items:
            type: object
            required: [groupTitle, offeredRole, inviteeEmail, createdAt]
            properties:
              groupTitle: { type: string }
              offeredRole: { $ref: "#/components/schemas/OfferedRole" }
              inviteeEmail: { type: string, description: "Edini podatek drugega uporabnika v izvozu; ga je uporabnik sam vpisal ob vabljenju (006)." }
              createdAt: { type: string, format: date-time }
        ownedGroups:
          type: array
          items:
            type: object
            required: [title, description, color, state, createdAt]
            properties:
              title: { type: string }
              description: { type: [string, "null"] }
              color: { type: string, enum: [tinta, mah, opeka, oker, sliva, morje, grafit, rja] }
              state: { type: string, enum: [ACTIVE, ARCHIVED] }
              createdAt: { type: string, format: date-time }
