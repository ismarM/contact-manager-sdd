openapi: 3.1.0
info:
  title: Contact Manager – izvoz izbranih kontaktov v Excel (010)
  version: 0.1.0
  description: >
    Izvoz izbora kontaktov skupine (009) v datoteko .xlsx z enim listom. Samo branje: dovoljeno vsem članom (VIEWER in
    višje), tudi v arhivirani in trajno arhivirani skupini; ne spremeni nobenega kontakta in ne ustvari vnosa v revizijski
    sledi (FR-010-14). Vrstni red preverjanj (feature-map §2.2, research.md R-04): 401 → 404 (nečlan, neobstoječa skupina
    ali identiteta, ki nikoli ni bila kontakt te skupine) → 400 VALIDATION_FAILED → 409 EXPORT_EMPTY. Koraka 403 in
    409 GROUP_ARCHIVED ni. Pred klicem vmesnik izvede POST /groups/{groupId}/contacts/selection-check (009, FR-009-18).
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /groups/{groupId}/contacts/export:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      summary: Izvoz izbranih kontaktov v .xlsx (FR-010-02 … FR-010-09, FR-010-11 … FR-010-14, FR-010-16)
      description: >
        Vrstice so obstoječi kontakti iz contactIds, razvrščeni kot seznam 008 (sort, dir; privzeto priimek, ime,
        naraščajoče; D-63). Stolpci: Ime, Priimek, Naslov, E-naslov, Telefon (en: First name, Last name, Address, Email,
        Phone), nato po en stolpec za vsak ključ dodatnega atributa izvoženih kontaktov (slovenska abeceda ne glede na
        velikost črk, D-63; glava je zapis ključa iz prve vrstice, ki ga ima), na koncu Značke / Tags (značke po slovenski
        abecedi, ločene z ", "). Vse celice so besedilo; vrednost (in glava), ki se začne z =, +, -, @, tabulatorjem ali
        CR, dobi vodilni '. Datoteka ne vsebuje formul. Identitete, ki so bile kontakti te skupine in so medtem izbrisane
        ali združene, se izpustijo in štejejo v X-Export-Skipped. Ime datoteke določi odjemalec (research.md R-03).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
            example:
              contactIds: ['0193a5b0-7c1e-7d4a-9a51-1f2e3d4c5b6a', '0193a5b0-7c1e-7d4a-9a51-1f2e3d4c5b6b']
              sort: email
              dir: desc
              language: sl
      responses:
        '200':
          description: Datoteka .xlsx
          headers:
            X-Export-Count:
              description: Število vrstic kontaktov v datoteki (≥ 1)
              schema: { type: integer, minimum: 1 }
            X-Export-Skipped:
              description: Število izbranih kontaktov te skupine, ki so bili medtem izbrisani ali združeni (FR-010-11)
              schema: { type: integer, minimum: 0 }
            Content-Disposition:
              description: 'attachment; filename="contacts.xlsx" (rezerva; vmesnik shrani z imenom po FR-010-10)'
              schema: { type: string }
            Cache-Control:
              schema: { const: no-store }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Noben izbrani kontakt ne obstaja več (FR-010-11); datoteka se ne ustvari
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties: { code: { const: EXPORT_EMPTY } }
              example: { code: EXPORT_EMPTY }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    GroupId: { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    ExportRequest:
      type: object
      required: [contactIds, language]
      additionalProperties: false
      properties:
        contactIds:
          type: array
          minItems: 1
          maxItems: 10000
          description: Identitete kontaktov izbora; podvojene se zlijejo (štejejo se enkrat), meja velja po zlitju
          items: { type: string, format: uuid }
        sort:
          type: string
          description: 'Kot parameter sort v 008: firstName, lastName, address, email, phone ali attr:‹ključ›; privzeto lastName'
        dir:
          type: string
          enum: [asc, desc]
          default: asc
        language:
          type: string
          enum: [sl, en]
          description: Jezik glave predefiniranih stolpcev in imena lista (Kontakti / Contacts)
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: body, contactIds, contactIds[i], sort, dir, language ali ime neznanega polja (UNKNOWN_FIELD)
        code:
          type: string
          enum: [REQUIRED, TOO_MANY, INVALID_VALUE, MALFORMED, UNKNOWN_FIELD, TOO_MANY_COLUMNS]
          description: >
            TOO_MANY – več kot 10 000 identitet (FR-010-13); TOO_MANY_COLUMNS – izvoženi kontakti imajo skupaj več
            različnih ključev, kot jih sprejme list (več kot 16 378 ključev oziroma 6 + ključi > 16 384, FR-010-13,
            research.md R-09); UNKNOWN_FIELD – neznano polje v telesu. Ključ razvrščanja attr:‹ključ›, ki ga v skupini
            nima noben kontakt, ni napaka (vrstice po priimku in imenu, spec Edge Cases)
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
  responses:
    Unauthenticated:
      description: Ni veljavnega žetona
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: UNAUTHENTICATED } } }
    NotFound:
      description: >
        Nečlan, neobstoječa skupina ali identiteta, ki nikoli ni bila kontakt te skupine (kontakt druge skupine ali
        izmišljena); prazno telo, obstoj se ne razkrije, datoteka se ne ustvari (FR-010-12)
    ValidationFailed:
      description: Neveljavno telo, prazen izbor ali več kot 10 000 kontaktov; napake po poljih; datoteka se ne ustvari
      content:
        application/json:
          schema:
            type: object
            required: [code, errors]
            properties:
              code: { const: VALIDATION_FAILED }
              errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
          examples:
            empty: { value: { code: VALIDATION_FAILED, errors: [{ field: contactIds, code: REQUIRED }] } }
            tooMany: { value: { code: VALIDATION_FAILED, errors: [{ field: contactIds, code: TOO_MANY }] } }
