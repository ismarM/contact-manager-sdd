openapi: 3.1.0
info:
  title: Contact Manager – revizijska sled skupine (005)
  version: 0.1.0
  description: >
    Revizijska sled sprememb kontaktov skupine in rollback. Branje: VIEWER, tudi v arhivirani skupini. Rollback: ADMIN.
    Vrstni red preverjanj (feature-map §2.2, D-41): 401 → 404 (nečlan, neobstoječa skupina, neobstoječ vnos ali vnos druge
    skupine) → 403 → 409 GROUP_ARCHIVED → 400 VALIDATION_FAILED → 409 VERSION_CONFLICT → 409 ROLLBACK_NO_CHANGES.
    Vnosov ni mogoče spremeniti ali izbrisati (FR-005-05): PUT/PATCH/DELETE na poti vnosa vrnejo 405 s praznim telesom (neprijavljen 401).
    Dopolnitve shem 004 (ContactDetail.reverted, ContactSummary.reverted) so v components/schemas pod Contact*Extension.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /groups/{groupId}/audit:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      summary: Stran vnosov revizijske sledi, najnovejši zgoraj (FR-005-07, FR-005-09, FR-005-10, FR-005-14); VIEWER; tudi v arhivirani skupini
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 'Prazna vrednost ali neštevilo → 400 (kot 004, D-43)' }
        - { name: size, in: query, schema: { type: integer, enum: [25, 50, 100], default: 25 } }
        - name: action
          in: query
          description: 'Filter po vrsti dejanja; ponovljiv (action=DELETE&action=MERGE); neznana vrednost → 400 s poljem action'
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/AuditAction' } }
        - name: contact
          in: query
          description: 'Filter po kontaktu (tudi izbrisanem); kontakt druge skupine → prazen seznam; neveljaven uuid → 400 s poljem contact'
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Stran, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /groups/{groupId}/audit/{entryId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/EntryId'
    get:
      summary: En vnos (cilj povezav iz vnosa rollback in oznake Povrnjeno; FR-005-12, FR-005-19); VIEWER; tudi v arhivirani skupini
      responses:
        '200': { description: Vnos, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEntry' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Ne obstaja – vnosi so nespremenljivi (FR-005-05)
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    patch:
      summary: Ne obstaja – vnosi so nespremenljivi (FR-005-05)
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    delete:
      summary: Ne obstaja – vnosi so nespremenljivi (FR-005-05)
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /groups/{groupId}/audit/{entryId}/changes:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/EntryId'
    get:
      summary: Paginiran seznam prizadetih kontaktov vnosa s spremenjenimi polji (FR-005-02, FR-005-08); VIEWER; tudi v arhivirani skupini
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, enum: [25, 50, 100], default: 25 } }
      responses:
        '200': { description: Stran sprememb v vrstnem redu vnosa, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePage' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /groups/{groupId}/audit/{entryId}/rollback:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/EntryId'
    post:
      summary: Rollback na stanje takoj po vnosu (FR-005-11 … FR-005-15, FR-005-17, FR-005-19); ADMIN; v arhivirani skupini zavrnjen
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RollbackRequest' } } }
      responses:
        '201': { description: 'Uspeh; telo je nov vnos ROLLBACK (na vrhu sledi)', content: { application/json: { schema: { $ref: '#/components/schemas/AuditEntry' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RollbackConflict' }
  /groups/{groupId}/audit/initial-state/rollback:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      summary: Rollback na Začetno stanje – stanje pred prvim vnosom (FR-005-20, sicer kot rollback na vnos); ADMIN; v arhivirani skupini zavrnjen
      description: 'Prazna sled → 409 ROLLBACK_NO_CHANGES (po preverjanju vloge, arhiviranosti in telesa).'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RollbackRequest' } } }
      responses:
        '201': { description: 'Uspeh; telo je nov vnos ROLLBACK s targetInitial = true', content: { application/json: { schema: { $ref: '#/components/schemas/AuditEntry' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RollbackConflict' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    GroupId: { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    EntryId: { name: entryId, in: path, required: true, schema: { type: string, format: uuid }, description: 'Neveljaven uuid → 404' }
  schemas:
    AuditAction:
      type: string
      enum: [CREATE, UPDATE, DELETE, MERGE, ROLLBACK]
      description: 'dodajanje, urejanje, odstranjevanje, združevanje, rollback (FR-005-03)'
    UserRef:
      type: object
      required: [email]
      properties:
        name: { type: [string, 'null'] }
        email: { type: string }
    AuditEntry:
      type: object
      required: [id, createdAt, actor, action, contactCount, contactName, target, targetInitial]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: 'strežniški čas vnosa' }
        actor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: 'null = izbrisan uporabnik' }
        action: { $ref: '#/components/schemas/AuditAction' }
        contactCount: { type: integer, minimum: 1 }
        contactName: { type: [string, 'null'], description: 'prikazno ime ob času vnosa, kadar je contactCount = 1' }
        target:
          description: 'samo ROLLBACK na vnos: ciljni vnos T; sicer null'
          oneOf:
            - type: 'null'
            - type: object
              required: [entryId, createdAt]
              properties:
                entryId: { type: string, format: uuid }
                createdAt: { type: string, format: date-time }
        targetInitial: { type: boolean, description: 'true samo pri ROLLBACK na Začetno stanje' }
    AuditPage:
      type: object
      required: [total, page, size, items, latestEntryId, contactFilter]
      properties:
        total: { type: integer, format: int64, description: 'število vnosov, ki ustrezajo filtrom' }
        page: { type: integer }
        size: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        latestEntryId:
          type: [string, 'null']
          format: uuid
          description: 'najnovejši vnos CELOTNE sledi ne glede na filtre (Clarifications 2026-11-08); null = prazna sled'
        contactFilter:
          description: 'null, če filter po kontaktu ni uporabljen'
          oneOf:
            - type: 'null'
            - type: object
              required: [id, displayName]
              properties:
                id: { type: string, format: uuid }
                displayName: { type: [string, 'null'], description: 'ime iz najnovejše spremembe kontakta v tej skupini; null, če kontakt v sledi skupine nima vnosov' }
    ChangeField:
      type: object
      required: [field, key, before, after]
      properties:
        field: { type: string, enum: [FIRST_NAME, LAST_NAME, ADDRESS, EMAIL, PHONE, ATTRIBUTE, TAGS] }
        key: { type: [string, 'null'], description: 'ključ dodatnega atributa (točen zapis); null za druga polja' }
        before:
          description: 'besedilo ali null; pri TAGS seznam (prazen, če ni značk)'
          oneOf: [{ type: 'null' }, { type: string }, { type: array, items: { type: string } }]
        after:
          oneOf: [{ type: 'null' }, { type: string }, { type: array, items: { type: string } }]
    ContactChange:
      type: object
      required: [contactId, displayName, kind, fields]
      properties:
        contactId: { type: string, format: uuid }
        displayName: { type: string, description: 'prikazno ime ob času vnosa' }
        kind: { type: string, enum: [ADDED, REMOVED, CHANGED], description: 'ADDED: stolpec Prej prazen; REMOVED: stolpec Potem prazen' }
        fields:
          type: array
          description: >
            Samo spremenjena polja v vrstnem redu FIRST_NAME, LAST_NAME, ADDRESS, EMAIL, PHONE, ATTRIBUTE (ključi iz stanja prej,
            nato novi ključi), TAGS (research R-03). Pri ADDED/REMOVED vsa izpolnjena polja.
          items: { $ref: '#/components/schemas/ChangeField' }
    ChangePage:
      type: object
      required: [total, page, size, items]
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/ContactChange' } }
    RollbackRequest:
      type: object
      required: [latestEntryId]
      properties:
        latestEntryId: { type: string, format: uuid, description: 'najnovejši vnos celotne sledi, ki ga je uporabnik videl (AuditPage.latestEntryId); manjka ali ni uuid → 400 s poljem latestEntryId' }
    RevertInfo:
      type: object
      description: 'Oznaka Povrnjeno na kontaktu (FR-005-19)'
      required: [rollbackEntryId, rolledBackAt, rolledBackBy, targetEntryId, targetAt, targetInitial]
      properties:
        rollbackEntryId: { type: string, format: uuid }
        rolledBackAt: { type: string, format: date-time }
        rolledBackBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: 'null = izbrisan uporabnik' }
        targetEntryId: { type: [string, 'null'], format: uuid, description: 'null pri Začetnem stanju' }
        targetAt: { type: [string, 'null'], format: date-time, description: 'čas vnosa T; null pri Začetnem stanju' }
        targetInitial: { type: boolean }
    ContactDetailExtension:
      description: 'Dopolnitev 004 ContactDetail (tudi v VERSION_CONFLICT.current); updatedBy/updatedAt po rollbacku iz točke T'
      type: object
      required: [reverted]
      properties:
        reverted: { oneOf: [{ $ref: '#/components/schemas/RevertInfo' }, { type: 'null' }] }
    ContactSummaryExtension:
      description: 'Dopolnitev 004 ContactSummary (seznam kontaktov)'
      type: object
      required: [reverted]
      properties:
        reverted: { type: boolean }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, enum: [page, size, action, contact, latestEntryId, body] }
        code: { type: string, enum: [REQUIRED, INVALID_VALUE, MALFORMED] }
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
  responses:
    Unauthenticated: { description: 'Ni veljavnega žetona', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: UNAUTHENTICATED } } } }
    NotFound: { description: 'Nečlan, neobstoječa skupina, neobstoječ vnos, vnos druge skupine ali neveljaven uuid; prazno telo' }
    MethodNotAllowed:
      description: 'Metoda za to pot ne obstaja; prazno telo, glava Allow (npr. GET). Enako za vse vloge in nečlana – obstoj skupine se ne razkrije.'
      headers:
        Allow: { schema: { type: string }, example: GET }
    Forbidden: { description: 'Vloga pod ADMIN (tudi v arhivirani skupini)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: FORBIDDEN } } } }
    RollbackConflict:
      description: >
        GROUP_ARCHIVED (ADMIN, OWNER v arhivirani skupini); VERSION_CONFLICT (v sledi je medtem nastal novejši vnos – current
        nosi trenutni latestEntryId); ROLLBACK_NO_CHANGES (rollback ne bi spremenil nobenega kontakta, npr. na najnovejši vnos).
        V vseh primerih se nič ne spremeni in ne nastane vnos.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [code, current]
                properties:
                  code: { const: VERSION_CONFLICT }
                  current:
                    type: object
                    required: [latestEntryId]
                    properties:
                      latestEntryId: { type: string, format: uuid }
          examples:
            archived: { value: { code: GROUP_ARCHIVED } }
            noChanges: { value: { code: ROLLBACK_NO_CHANGES } }
            stale: { value: { code: VERSION_CONFLICT, current: { latestEntryId: 0190f5a2-7c3e-7b1a-9f00-0a1b2c3d4e5f } } }
    ValidationFailed:
      description: 'Neveljavni parametri ali telo; nič se ne spremeni'
      content:
        application/json:
          schema:
            type: object
            required: [code, errors]
            properties:
              code: { const: VALIDATION_FAILED }
              errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
