openapi: 3.1.0
info:
  title: Contact Manager API – ogrodje (000)
  version: 0.1.0
  description: >
    V funkcionalnosti 000 ima zaledje samo javno preverjanje zdravja. Vse ostale poti pod /api
    so privzeto zavrnjene z 401 (FR-000-10). Vsak odgovor vsebuje glavo X-Request-Id (FR-000-20).
servers:
  - url: http://localhost:8080
    description: razvoj prek nginx (docker compose up)
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Preverjanje pripravljenosti (FR-000-02)
      security: []
      responses:
        "200":
          description: Pripravljeno – baza je dosegljiva.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: UP }
        "503":
          description: Ni pripravljeno – baza ni dosegljiva. Brez notranjih podrobnosti.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: DOWN }
  /api/{anyPath}:
    parameters:
      - name: anyPath
        in: path
        required: true
        description: Katerakoli pot pod /api razen /api/health (tudi neobstoječa).
        schema: { type: string }
    get: &deny
      summary: Privzeta zavrnitev (FR-000-10)
      description: >
        V 000 vedno 401, z žetonom ali brez (preverjanje žetonov Firebase doda 001-prijava).
        Velja za vse metode (GET, POST, PUT, PATCH, DELETE).
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          description: Če ustreza ^[A-Za-z0-9-]{1,64}$, se uporabi; sicer zaledje ustvari novega.
          schema: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$" }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post: *deny
    put: *deny
    patch: *deny
    delete: *deny
components:
  headers:
    X-Request-Id:
      description: ID zahtevka; isti ID je v vseh vrsticah loga zaledja za ta zahtevek (FR-000-20).
      schema: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$" }
  responses:
    Unauthenticated:
      description: Ni veljavnega žetona.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: UNAUTHENTICATED }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN] }
    ErrorResponse:
      type: object
      description: >
        Skupna oblika napake (feature-map.md §2.2, §2.10). Polje errors (napake po poljih) doda
        prva funkcionalnost z VALIDATION_FAILED.
      required: [code]
      properties:
        code:
          type: string
          description: Strojno berljiva koda iz registra feature-map.md §2.10.
          examples: [UNAUTHENTICATED]
