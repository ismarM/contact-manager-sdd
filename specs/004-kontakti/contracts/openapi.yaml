openapi: 3.1.0
info:
  title: Contact Manager – kontakti skupine (004)
  version: 0.1.0
  description: >
    Kontakti znotraj skupine. Vrstni red preverjanj (feature-map §2.2): 401 → 404 (nečlan, neobstoječa skupina ali
    kontakt, kontakt druge skupine) → 403 → 409 GROUP_ARCHIVED → 409 VERSION_CONFLICT → 400 VALIDATION_FAILED.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /groups/{groupId}/contacts:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      summary: Stran kontaktov skupine (FR-004-06), najnižja vloga VIEWER; dovoljeno tudi v arhivirani skupini
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, enum: [25, 50, 100], default: 25 } }
      responses:
        '200': { description: Stran, content: { application/json: { schema: { $ref: '#/components/schemas/ContactPage' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Ustvarjanje kontakta (FR-004-01, FR-004-02), najnižja vloga EDITOR
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ContactInput' } } }
      responses:
        '201': { description: Ustvarjen, content: { application/json: { schema: { $ref: '#/components/schemas/ContactDetail' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GroupArchived' }
  /groups/{groupId}/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - { name: contactId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Pogled kontakta (FR-004-08, FR-004-14), najnižja vloga VIEWER; dovoljeno tudi v arhivirani skupini
      responses:
        '200': { description: Kontakt, content: { application/json: { schema: { $ref: '#/components/schemas/ContactDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: >
        Urejanje kontakta (FR-004-10, FR-004-11, FR-004-13), najnižja vloga EDITOR. Zastarela verzija z vrednostmi,
        enakimi trenutnim, uspe (200) brez povečanja verzije; z različnimi vrednostmi 409 VERSION_CONFLICT.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ContactUpdate' } } }
      responses:
        '200': { description: Kontakt, content: { application/json: { schema: { $ref: '#/components/schemas/ContactDetail' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Izbris kontakta (FR-004-12, FR-004-13), najnižja vloga EDITOR; zastarela verzija vedno 409
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '204': { description: Izbrisan }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /groups/{groupId}/tags:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      summary: Predlogi značk te skupine (FR-004-04), najnižja vloga EDITOR
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 50 } }
      responses:
        '200': { description: Do 20 značk, content: { application/json: { schema: { $ref: '#/components/schemas/TagSuggestions' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    GroupId: { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Attribute:
      type: object
      required: [key, value]
      properties:
        key: { type: string, minLength: 1, maxLength: 50 }
        value: { type: string, minLength: 1, maxLength: 500 }
    ContactInput:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: [string, 'null'], maxLength: 100 }
        lastName: { type: [string, 'null'], maxLength: 100 }
        address: { type: [string, 'null'], maxLength: 300 }
        email: { type: [string, 'null'], maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 30 }
        attributes: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Attribute' } }
        tags: { type: array, maxItems: 30, items: { type: string, minLength: 1, maxLength: 50, pattern: '^\S+$' } }
    ContactUpdate:
      allOf:
        - $ref: '#/components/schemas/ContactInput'
        - type: object
          required: [version]
          properties:
            version: { type: integer, format: int64 }
    ContactSummary:
      type: object
      required: [id, displayName, tags, version]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        displayName: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        version: { type: integer, format: int64 }
    ContactPage:
      type: object
      required: [total, page, size, items]
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/ContactSummary' } }
    ContactDetail:
      type: object
      required: [id, displayName, attributes, tags, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        displayName: { type: string }
        address: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        attributes: { type: array, items: { $ref: '#/components/schemas/Attribute' } }
        tags: { type: array, items: { type: string } }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: 'null = izbrisan uporabnik' }
    UserRef:
      type: object
      required: [email]
      properties:
        name: { type: [string, 'null'] }
        email: { type: string }
    TagSuggestions:
      type: object
      required: [tags]
      properties:
        tags: { type: array, maxItems: 20, items: { type: string } }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, description: 'firstName, lastName, address, email, phone, attributes, attributes[i].key, attributes[i].value, tags, tags[i], version, body' }
        code: { type: string, enum: [REQUIRED, TOO_LONG, INVALID_VALUE, DUPLICATE, RESERVED_KEY, TOO_MANY, UNKNOWN_FIELD, MALFORMED] }
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
  responses:
    Unauthenticated: { description: 'Ni veljavnega žetona', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: UNAUTHENTICATED } } } }
    NotFound: { description: 'Nečlan, neobstoječa skupina, neobstoječ kontakt ali kontakt druge skupine; prazno telo' }
    Forbidden: { description: 'Vloga pod najnižjo dovoljeno', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: FORBIDDEN } } } }
    GroupArchived: { description: 'Pisanje v arhivirani skupini', content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: GROUP_ARCHIVED } } } }
    Conflict:
      description: 'GROUP_ARCHIVED ali VERSION_CONFLICT (s trenutnim stanjem kontakta)'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [code, current]
                properties:
                  code: { const: VERSION_CONFLICT }
                  current: { $ref: '#/components/schemas/ContactDetail' }
    ValidationFailed:
      description: 'Neveljavni podatki; nič se ne shrani'
      content:
        application/json:
          schema:
            type: object
            required: [code, errors]
            properties:
              code: { const: VALIDATION_FAILED }
              errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
