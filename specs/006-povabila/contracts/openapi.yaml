openapi: 3.1.0
info:
  title: Contact Manager API – povabila v skupino (006)
  version: 0.1.0
  description: >
    Pošiljanje, pregled in umik povabil skupine (vezano na skupino) ter seznam, število, sprejem in zavrnitev prejetih povabil
    (vezano na uporabnika). Vrstni red preverjanj (feature-map §2.2): 401, 404 (nečlan oz. tuj vir = neobstoječ vir, prazno telo),
    403 FORBIDDEN, 409 GROUP_ARCHIVED, 400 VALIDATION_FAILED, 409 z imenovano kodo poslovnega pravila. Sprejem, zavrnitev in umik so
    dovoljeni tudi v arhivirani skupini (D-54). Obdelana ali umaknjena povabila ne obstajajo več (404).
servers:
  - url: http://localhost:8080
security:
  - firebaseIdToken: []
paths:
  /api/groups/{groupId}/invitations:
    post:
      operationId: sendInvitation
      summary: Pošlje povabilo registriranemu uporabniku (najnižja vloga ADMIN; FR-006-02, FR-006-03)
      description: >
        Ponujena vloga mora biti strogo nižja od klicateljeve in ni OWNER (sicer 403, tudi pred 409 GROUP_ARCHIVED in 400).
        E-naslov se obreže in primerja ne glede na velikost črk. Poslovna pravila v vrstnem redu: CANNOT_INVITE_SELF,
        INVITEE_NOT_REGISTERED, ALREADY_MEMBER, INVITATION_ALREADY_PENDING.
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendInvitation" }
            example: { email: " Ana@Primer.si ", role: EDITOR }
      responses:
        "201":
          description: Povabilo je ustvarjeno.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutgoingInvitation" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Skupina je arhivirana ali je kršeno poslovno pravilo; povabilo ne nastane.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
                    enum: [GROUP_ARCHIVED, CANNOT_INVITE_SELF, INVITEE_NOT_REGISTERED, ALREADY_MEMBER, INVITATION_ALREADY_PENDING]
              example: { code: INVITEE_NOT_REGISTERED }
    get:
      operationId: listGroupInvitations
      summary: Čakajoča povabila skupine (najnižja vloga ADMIN; dovoljeno v arhivirani skupini; FR-006-13)
      description: Vsa čakajoča povabila skupine ne glede na povabitelja, urejena po createdAt padajoče, nato po id padajoče.
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutgoingInvitations" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/groups/{groupId}/invitations/{invitationId}:
    delete:
      operationId: withdrawInvitation
      summary: Umakne čakajoče povabilo (najnižja vloga ADMIN; povabilo z vlogo ADMIN samo OWNER; FR-006-14, FR-006-16)
      description: >
        Dovoljeno tudi v arhivirani in trajno arhivirani skupini. Vrstni red: 401, 404 (nečlan), 403 (vloga pod ADMIN),
        404 (povabilo ne obstaja v tej skupini ali ni več čakajoče), 403 (ADMIN umika povabilo z vlogo ADMIN).
      parameters:
        - { $ref: "#/components/parameters/GroupId" }
        - { $ref: "#/components/parameters/InvitationId" }
      responses:
        "204": { description: Povabilo je umaknjeno (izbrisano). }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/invitations:
    get:
      operationId: listReceivedInvitations
      summary: Moja čakajoča povabila (prijavljen uporabnik; FR-006-05, FR-006-07, FR-006-12)
      description: >
        Samo povabila klicatelja, urejena po createdAt padajoče, nato po id padajoče. Vsebuje povabila v arhivirane skupine
        (group.archived). Povabila izbrisanih skupin ne obstajajo. Uporabnik brez profila dobi prazen seznam.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivedInvitations" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/invitations/count:
    get:
      operationId: countReceivedInvitations
      summary: Število mojih čakajočih povabil za zgornjo vrstico (FR-006-06)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties: { count: { type: integer, minimum: 0 } }
              example: { count: 3 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/invitations/{invitationId}/accept:
    post:
      operationId: acceptInvitation
      summary: Sprejme povabilo; klicatelj postane član s ponujeno vlogo (FR-006-08, FR-006-09, FR-006-11, FR-006-12)
      description: >
        Dovoljeno tudi v arhivirani in trajno arhivirani skupini (član ima tam efektivno pravice bralca). Tuje, neobstoječe,
        obdelano ali umaknjeno povabilo in povabilo v izbrisano skupino → 404. Če je klicatelj že član, je povabilo izbrisano,
        vloga ostane nespremenjena in odgovor je 409 ALREADY_MEMBER.
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedInvitation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/InvitationNotFound" }
        "409":
          description: Klicatelj je že član skupine; povabilo je odstranjeno.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: ALREADY_MEMBER }
  /api/invitations/{invitationId}/decline:
    post:
      operationId: declineInvitation
      summary: Zavrne povabilo (FR-006-10, FR-006-11)
      description: Dovoljeno tudi za povabila v arhivirane skupine. Tuje, neobstoječe, obdelano ali umaknjeno povabilo → 404.
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "204": { description: Povabilo je zavrnjeno (izbrisano). }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/InvitationNotFound" }
components:
  securitySchemes:
    firebaseIdToken: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Neveljaven zapis uuid → 404.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    ValidationFailed:
      description: Neveljavni podatki ali poizvedbena spremenljivka; nič se ne ustvari.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationFailed" }
          example: { code: VALIDATION_FAILED, errors: [{ field: email, code: INVALID_VALUE }] }
    Unauthenticated:
      description: Ni žetona, neveljaven ali potekel žeton.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: UNAUTHENTICATED }
    Forbidden:
      description: Vloga člana je prenizka ali ponujena / umaknjena vloga ni strogo nižja od klicateljeve.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: FORBIDDEN }
    NotFound:
      description: Skupina ali povabilo v njej ne obstaja ali uporabnik ni član (prazno telo; obstoj se ne razkrije).
    InvitationNotFound:
      description: Povabilo ne obstaja, ni klicateljevo, je že obdelano ali umaknjeno (prazno telo; obstoj se ne razkrije).
  schemas:
    Error:
      type: object
      required: [code]
      properties: { code: { type: string } }
    ValidationFailed:
      type: object
      required: [code, errors]
      properties:
        code: { type: string, const: VALIDATION_FAILED }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string, enum: [email, role, body, page, size] }
              code: { type: string, enum: [REQUIRED, TOO_LONG, INVALID_VALUE, UNKNOWN_FIELD, MALFORMED] }
    OfferedRole:
      type: string
      enum: [ADMIN, EDITOR, VIEWER]
    SendInvitation:
      type: object
      required: [email, role]
      properties:
        email: { type: string, description: "Po obrezu 1–254 znakov, veljavna oblika e-naslova." }
        role:
          type: string
          description: "ADMIN, EDITOR ali VIEWER; OWNER ali vloga, ki ni strogo nižja od klicateljeve → 403; druga vrednost → 400."
    UserRef:
      description: Kot v 002; null pomeni izbrisanega uporabnika.
      type: object
      required: [email]
      properties:
        name: { type: [string, "null"] }
        email: { type: string }
    OutgoingInvitation:
      type: object
      required: [id, inviteeEmail, role, invitedBy, createdAt, canWithdraw]
      properties:
        id: { type: string, format: uuid }
        inviteeEmail: { type: string }
        role: { $ref: "#/components/schemas/OfferedRole" }
        invitedBy: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        canWithdraw:
          type: boolean
          description: Klicatelj je OWNER ali (ADMIN in role ni ADMIN).
    OutgoingInvitations:
      type: object
      required: [total, page, size, items]
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/OutgoingInvitation" } }
    InvitationGroup:
      type: object
      required: [id, title, color, archived]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, description: Trenutni naslov skupine. }
        color: { type: string, enum: [tinta, mah, opeka, oker, sliva, morje, grafit, rja] }
        archived: { type: boolean, description: Arhivirana ali trajno arhivirana skupina. }
    ReceivedInvitation:
      type: object
      required: [id, group, role, invitedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        group: { $ref: "#/components/schemas/InvitationGroup" }
        role: { $ref: "#/components/schemas/OfferedRole" }
        invitedBy: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
    ReceivedInvitations:
      type: object
      required: [total, page, size, items]
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/ReceivedInvitation" } }
    AcceptedInvitation:
      type: object
      required: [groupId, title, role, archived]
      properties:
        groupId: { type: string, format: uuid }
        title: { type: string }
        role: { $ref: "#/components/schemas/OfferedRole" }
        archived: { type: boolean }
