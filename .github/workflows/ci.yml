# CI (FR-000-11): ista vrata kot lokalno – ./verify.sh full; ob neuspehu priloži .verify/last.log.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Odvisnosti npm
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix e2e ci --no-audit --no-fund

      - name: Brskalnik za E2E
        run: npm --prefix e2e exec -- playwright install --with-deps chromium

      - name: Vrata kakovosti
        run: ./verify.sh full

      - name: Dnevnik verify
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: verify-log
          path: .verify/last.log
          if-no-files-found: ignore
