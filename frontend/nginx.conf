# Isti izvor za vmesnik in API (FR-000-01); ID zahtevka in dnevnik brez poizvedbe (FR-000-20).
log_format kontakti '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                    '$request_time rid=$request_id';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log kontakti;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Firebase Auth Emulator na istem izvoru (specs/001-prijava/research.md R-04).
    location ~ ^/(identitytoolkit\.googleapis\.com|securetoken\.googleapis\.com|emulator)/ {
        proxy_pass http://auth:9099;
        proxy_set_header Host $host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(index\.html|sw\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
