# Isti izvor za vmesnik in API (FR-000-01); ID zahtevka in dnevnik brez poizvedbe (FR-000-20).
log_format kontakti '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                    '$request_time rid=$request_id';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log kontakti;

    # 014 uvoz: datoteka do 10 MB (multipart) in predogled/potrditev do 10 000 kontaktov (JSON).
    location ~ ^/api/groups/[^/]+/imports {
        client_max_body_size 25m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 014 CardDAV (samo branje, gesla za aplikacijo): v produkciji samo prek HTTPS (TLS pred nginx).
    location /dav/ {
        client_max_body_size 1m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/carddav {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 018 slike: nalaganje slike (multipart, strežnik sprejme do 5 MB) pred splošno mejo za /api/.
    # Regularni izrazi imajo prednost pred predponsko lokacijo /api/, zato velja 6 MB samo za te tri poti.
    location ~ ^/api/me/photo$ {
        client_max_body_size 6m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/groups/[^/]+/photo$ {
        client_max_body_size 6m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/groups/[^/]+/contacts/[^/]+/photo$ {
        client_max_body_size 6m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 019 programski vmesnik z API ključi: brez glav CORS (namenjen strežniškim programom in skriptam, research R-02).
    location /v1/ {
        client_max_body_size 2m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Firebase Auth Emulator na istem izvoru (specs/001-prijava/research.md R-04).
    # Razrešitev je lena (spremenljivka + resolver), da nginx deluje tudi, ko storitve auth ni (compose.firebase.yaml).
    location ~ ^/(identitytoolkit\.googleapis\.com|securetoken\.googleapis\.com|emulator)/ {
        resolver 127.0.0.11 valid=10s;
        set $auth_upstream http://auth:9099;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(index\.html|sw\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
