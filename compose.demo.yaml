# Predstavitev: ločen projekt, baza v tmpfs (podatki se ne ohranijo ob ponovnem zagonu), storitev seed na ukaz.
name: contact-manager-demo
services:
  db:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql

  seed:
    image: node:22-alpine
    profiles: [seed]
    volumes:
      - ./demo:/demo:ro
    environment:
      AUTH_URL: http://auth:9099
      API_URL: http://backend:8080
    command: ["node", "/demo/seed.mjs"]
    depends_on:
      backend:
        condition: service_healthy
